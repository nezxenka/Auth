plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

group = 'org.nezxenka'
version = '2.0'

def shadedPackage = 'org.nezxenka.auth.libs'

java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly libs.paper.api
    compileOnly libs.slf4j.api

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    implementation(libs.hikaricp) {
        exclude group: 'org.slf4j'
    }
    implementation(libs.mysql.connector) {
        exclude group: 'com.google.protobuf'
    }
    implementation(libs.caffeine) {
        exclude group: 'org.checkerframework'
        exclude group: 'com.google.errorprone'
        exclude group: 'org.jspecify'
    }
    implementation(libs.gson) {
        exclude group: 'com.google.errorprone'
    }
    implementation libs.bcrypt
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 16
}

processResources {
    def props = [version: version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(props)
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveFileName = "${project.name}.jar"

    mergeServiceFiles()

    relocate 'com.zaxxer.hikari', "${shadedPackage}.hikari"
    relocate 'com.mysql', "${shadedPackage}.mysql"
    relocate 'com.github.benmanes.caffeine', "${shadedPackage}.caffeine"
    relocate 'com.google.gson', "${shadedPackage}.gson"
    relocate 'at.favre.lib', "${shadedPackage}.favre"

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'

    exclude 'com/mysql/cj/xdevapi/**'
    exclude 'com/mysql/cj/x/**'
}

assemble.dependsOn shadowJar
