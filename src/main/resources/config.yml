language: en

security:
  password:
    min-length: 6
    max-length: 30
    bcrypt-cost: 10
    legacy-hash-algorithm: SHA-256
  session:
    timeout: 300
  max-login-attempts: 3
  login-timeout: 60
  single-session: true
  ip-session:
    enabled: true
    lifetime: 21600

reminders:
  enabled: true
  interval: 5000

restrictions:
  block-commands: true
  block-movement: true
  block-chat: true
  block-interact: true
  block-damage: true
  block-inventory: true
  block-drop: true
  block-pickup: true
  block-break: true
  block-place: true
  allowed-commands:
    - login
    - l
    - log
    - register
    - reg

telegram:
  enabled: false
  bot-token: "YOUR_BOT_TOKEN_HERE"
  link-code-length: 8
  link-code-expiry: 300

  2fa:
    enabled: true
    timeout: 60

  notifications:
    join:
      enabled: true
    leave:
      enabled: true

  keyboard:
    approve:
      callback: "2fa_approve"
    decline:
      callback: "2fa_decline"
    unlink:
      callback: "unlink"
    info:
      callback: "info"
    instruction:
      callback: "info"
